# Throwaway harness: verifies Mage-OS lanes work on mariadb:11.4 after the
# healthcheck fix, i.e. that the mysql:8.4 override from #377 can be dropped.
# This repo's own CI only builds the magento-open-source matrix, so nothing here
# otherwise exercises a Mage-OS lane. Delete once #378 is settled.
#
# Two lanes, because the pinned releases and the rolling alpha live in different
# composer repositories:
#   nightly  -> kind=nightly              @alpha  from nightly.mage-os.org
#   release  -> kind=currently-supported  3.4.0   from repo.mage-os.org   <- what #378 is about
name: "[test] Mage-OS MariaDB verification"

on:
  push:
    branches:
      - test/mageos-mariadb-verify
  workflow_dispatch:

jobs:
  # ---------- nightly lane ----------
  matrix-nightly:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.sv.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./supported-version        # local => this branch, not @main
        id: sv
        with:
          kind: nightly
          project: mage-os
      - run: echo '${{ steps.sv.outputs.matrix }}' | tr ',' '\n' | grep -iE '"(mysql|mariadb)"|health-cmd' || true

  nightly:
    needs: [matrix-nightly]
    uses: ./.github/workflows/integration.yaml
    with:
      package_name: mage-os/demo-package
      use_local_source: false
      matrix: ${{ needs.matrix-nightly.outputs.matrix }}
      test_command: ../../../vendor/bin/phpunit ../../../vendor/mage-os/demo-package/Test/Integration
      fail-fast: false
      magento_repository: https://nightly.mage-os.org
      composer_cache_key: 'v1'

  # ---------- release lane ----------
  matrix-release:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.sv.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./supported-version
        id: sv
        with:
          kind: currently-supported
          project: mage-os
      - run: echo '${{ steps.sv.outputs.matrix }}' | tr ',' '\n' | grep -iE '"(mysql|mariadb)"|health-cmd' || true

  release:
    needs: [matrix-release]
    uses: ./.github/workflows/integration.yaml
    with:
      package_name: mage-os/demo-package
      use_local_source: false
      matrix: ${{ needs.matrix-release.outputs.matrix }}
      test_command: ../../../vendor/bin/phpunit ../../../vendor/mage-os/demo-package/Test/Integration
      fail-fast: false
      # pinned releases live here; nightly.mage-os.org only carries the rolling alpha
      magento_repository: https://repo.mage-os.org
      composer_cache_key: 'v1'
